persona:
  name: "Harvey"
  company: "Sua Empresa"
  role: "Comercial"
  email: "harvey@suaempresa.com.br"
  linkedin: "linkedin.com/in/harvey-suaempresa"
  tone: "profissional, consultivo, seguro"

product:
  name: "Seu Produto"
  description: "Descreva o que o seu produto faz e para quem ele é"
  pricing: "A partir de R$ X/mês"
  key_benefits:
    - "Benefício 1"
    - "Benefício 2"
    - "Benefício 3"
  objection_responses:
    "está caro": "Entendo, orçamento é orçamento. A maior parte dos nossos clientes vê o retorno em 30 dias..."
    "já tenho fornecedor": "Faz sentido. Curiosidade: o que você gostaria que ele fizesse e não faz?"
    "não tenho interesse": "Sem problema. Posso perguntar como vocês resolvem isso hoje?"
  offer:
    primary: ""                    # Oferta principal (ex.: "Mensalidade a partir de R$ 497/mês")
    entry: ""                      # Porta de entrada (ex.: "Diagnóstico gratuito", "7 dias de teste")
    goal: "book_call"              # Objetivo: book_call, start_trial, get_reply
    booking_method: "calendar_link" # calendar_link, suggest_times, ask_preference
    booking_url: ""                # Link da agenda (se usar calendar_link)
    meeting_duration: "15 minutos" # Duração da conversa
    meeting_owner: ""              # Quem atende (nome ou cargo)

icp:
  industries:
    - "Agência de Marketing"
    - "Clínica"
  company_size: "10-200 funcionários"
  titles:
    - "Sócio"
    - "Diretor Comercial"
    - "Gerente de Marketing"
    - "Head de Growth"
  geography:
    - "Brasil"
  # Cargos que indicam que a empresa está comprando AGORA (quem contrata um
  # "Head de Growth" está atrás de ferramenta de crescimento). Usado para
  # varrer página de carreiras e site de vaga. Vazio = cai nos titles acima.
  hiring_signals: []

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recomendado) | microsoft | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # nativo: você revisa na Caixa de Saída; Instantly: envio retido
    # link_domains: ["seusite.com.br"]  # outros sites seus além do domínio de
    #                                   # envio e do link da agenda; no piloto
    #                                   # automático, e-mail com link fora disso
    #                                   # espera por você
    send_to_risky: false        # enviar também para domínio catch-all (desligado = mais seguro)
    max_bounce_rate: 0.05       # pausa o envio se o retorno passar disso
    # Domínio de envio novo? Ponha em start_date o dia em que o aquecimento
    # começou: nada de e-mail frio por min_days, e depois o teto sobe de
    # start_sends por daily_increase ao dia até max_daily_sends. Resposta nunca
    # é retida. Só gmail/microsoft/smtp (o Instantly tem aquecimento próprio).
    # Confira quando quiser com `harvey warmup`.
    # O projeto original recomenda o TrulyInbox para aquecer:
    # https://trulyinbox.com/?via=harvey — ligue com
    # `harvey trulyinbox connect` e o `harvey warmup` passa a ler se a
    # caixa esta mesmo aquecida.
    warmup:
      start_date: ""            # AAAA-MM-DD; vazio = sem rampa
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""         # só se o seu provedor usar um fora do padrão
    # Manda e-mail frio só em horário comercial no fuso de quem recebe,
    # deduzido da localização da empresa ou do país. Quem o Harvey não
    # conseguir localizar recebe na janela de usage.quiet_hours.timezone.
    # Follow-up entra na janela; resposta nunca é retida.
    # Só gmail/microsoft/smtp. Tire o # para ligar.
    # Para o Brasil, 9h às 18h, de segunda a sexta:
    # send_window:
    #   start: "09:00"
    #   end: "18:00"
    #   weekdays_only: true       # segunda a sexta, em qualquer país
    #   recipient_timezone: true  # false: um fuso só para todo mundo
  linkedin:
    enabled: false             # precisa ser ligado na mão; ter credencial não liga
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/Sao_Paulo"

# LEI BRASILEIRA — leia antes de ligar o envio.
# A LGPD não proíbe e-mail frio B2B, mas exige base legal (legítimo interesse,
# art. 7º, IX), transparência sobre de onde veio o dado e um caminho fácil de
# oposição. Na prática, para o Brasil isso quer dizer: deixe claro quem está
# mandando, diga de onde você tirou o contato quando perguntarem, e atenda o
# pedido de saída na hora. O campo postal_address abaixo existe porque a lei
# americana (CAN-SPAM) exige endereço postal; no Brasil ele não é exigido, mas
# preencher com o endereço da empresa ajuda a entregabilidade e não atrapalha.
# Isto é a leitura do autor do fork, não é parecer jurídico.
compliance:
  postal_address: ""
  # Mantenha palavras que o Harvey reconhece como pedido de saída.
  opt_out_line: 'Não quer mais receber? Responda "sair" que eu não mando de novo.'
  # Nunca envie para estes, nem frio nem em resposta: concorrente, cliente seu,
  # quem estiver em disputa jurídica. Cada entrada é um e-mail ou um domínio, e
  # o domínio cobre os subdomínios ("acme.example" também bloqueia
  # "mail.acme.example", mas não "naoacme.example"). Checado na hora do envio,
  # então vale até para e-mail que você já aprovou na Caixa de Saída. Se você
  # treinou o Harvey, ponha em harvey.local.yaml: aquele arquivo ganha.
  do_not_contact: []
  #   - "concorrente.example"
  #   - "joao@acme.example"
  # O Precleared checa se a lei permite mandar e-mail frio para um endereço,
  # mas cobre Reino Unido, Estados Unidos, Canadá, Alemanha e França — não
  # cobre o Brasil. Deixe desligado se os seus leads são brasileiros.
  precleared:
    enabled: false
    sender_country: ""          # GB ou US: onde a sua empresa está
    address_source: "unknown"   # published | bought | scraped | given | unknown
    prospect_country: ""        # opcional, ex.: US se todos os leads são de um país só
